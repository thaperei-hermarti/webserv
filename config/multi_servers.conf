server {
    listen 127.0.0.1:8080;
    server_name localhost;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/500.html;
    client_max_body_size 10m;

    location / {
        root www/;
        index index.html;
        method GET HEAD POST DELETE;
        autoindex off;
        upload_store www/uploads;
    }

    location /redirect-target {
        return 302 /;
    }

    location /assets {
        root www/assets;
        autoindex on;
    }

    location /uploads {
        root www/uploads;
        method GET HEAD POST DELETE;
        autoindex off;
        upload_store www/uploads;
    }

    location /cgi {
        root cgi-bin;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .pl /usr/bin/perl;
        cgi_pass .php /usr/bin/php-cgi;
    }

    location /cgi-bin {
        root cgi-bin;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .pl /usr/bin/perl;
        cgi_pass .php /usr/bin/php-cgi;
    }
}

# Segunda porta, mostrando que um mesmo processo escuta em mais de um lugar
# e serve conteudo diferente em cada um.
server {
    listen 127.0.0.1:8081;
    server_name site1;
    root www/site1;
    index index.html;

    location / {
        method GET HEAD;
        autoindex on;
    }
}

# Mesma porta da anterior, interface diferente: sao dois sockets, nao um.
server {
    listen 127.0.0.2:8081;
    server_name site2;
    root www/site2;
    index index.html;

    location / {
        method GET HEAD;
        autoindex on;
    }
}
