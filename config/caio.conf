server {
	listen 8080;
	root www;
	index index.html index.php;
	client_max_body_size 1m;

	error_page 400 www/error_pages/400.html;
	error_page 403 www/error_pages/403.html;
	error_page 404 www/error_pages/404.html;
	error_page 405 www/error_pages/405.html;
	error_page 408 www/error_pages/408.html;
	error_page 413 www/error_pages/413.html;
	error_page 500 www/error_pages/500.html;
	error_page 501 www/error_pages/501.html;

	location / {
		autoindex off;
		index index.html index.htm;
	}

	location /uploads {
		root www/uploads;
		autoindex on;
		upload_dir www/uploads;
	}

	location /readonly {
		method GET;
		autoindex on;
		root www/readonly;
	}

	location /redirect {
		method GET;
		return 302 /;
	}

	location /cgi-bin {
		method GET POST;
		root www/cgi-bin;
		cgi_pass .py /usr/bin/python3;
		cgi_pass .php /usr/bin/php;
	}

	location /session-test {
		method GET POST;
		index session.html;
	}
}

server {
	listen 8081;
	root www/listener;
	index index.html index.htm;
	client_max_body_size 1m;

	error_page 404 www/error_pages/404.html;
	error_page 500 www/error_pages/500.html;

	location / {
	}

	location /uploads {
		autoindex on;
		upload_dir www/listener/uploads;
	}

	location /redirect {
		method GET;
		return 301 /;
	}
}
