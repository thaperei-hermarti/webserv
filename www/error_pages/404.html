<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found | webserv</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0d10;color:#f4f4f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{width:min(100%,720px);padding:clamp(20px,4vw,40px);border:1px solid #2a2e35;border-radius:18px;background:#12151a;box-shadow:0 24px 80px rgba(0,0,0,.45);text-align:center}
.eyebrow{margin:0 0 8px;color:#8b949e;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font-size:clamp(28px,6vw,52px);letter-spacing:-.04em}
p{margin:12px 0 0;color:#b7c0cc;line-height:1.5}
img{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;margin:24px auto;border-radius:12px}
a{display:inline-block;margin-top:8px;padding:10px 16px;border:1px solid #30363d;border-radius:999px;color:#f4f4f5;text-decoration:none}
a:hover{border-color:#8b949e}
footer{margin-top:18px;color:#6e7681;font-size:11px}
</style>
</head>
<body>
<main data-static-error-page="404">
<p class="eyebrow">webserv</p>
<h1>404 Not Found</h1>
<p>The requested resource could not be found.</p>
<img src="/error_pages/404.jpg" alt="404 Not Found">
<a href="/">Back to home</a>
<footer>HTTP 404</footer>
</main>
</body>
</html>
